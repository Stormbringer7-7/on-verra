# Codes d'actes publiés -> phase et rôle, communs à tous les modèles de la juridiction.
# Le premier motif qui correspond l'emporte (ordre du fichier) ; un acte sans correspondance est
# « hors modèle » (compté, listé, jamais placé de force).
#
# Rôles :
#   ouvre     : l'étape a commencé (réunion, nomination, saisine, séance) ;
#   conclut   : l'acte qui dit l'étape faite (rapport de la commission au fond, décision) ;
#   annexe    : montré, sans effet sur l'état (structure, étude d'impact, avis du Conseil d'État) ;
#   deviation : acte d'une déviation seulement. Un acte qui ouvre ou conclut peut aussi porter une
#               déviation (`deviation`), par ex. « considéré comme adopté (49.3) ».
# Une déviation est rattachée à l'étape de l'acte classé qui la précède dans l'ordre publié.
#
# AN : `codeActe` des dossiers législatifs (« AN1-COM-FOND-RAPPORT ») ; préfixes de lecture AN1,
# SN1, AN2…, ANNLEC, SNNLEC, ANLDEF, ANLUNI (lecture unique), AN20 (contrôle), AN21 (Gouvernement).
# Sénat : codes « DOSLEG-… » composés par l'adaptateur à partir de DOSLEG (lecture `typleccod`,
# assemblée `codass`, origine du texte `oritxtcod`) : voir src/adaptateurs/sources/senat/dossiers.py.

juridiction = "FR"

# Déviations communes à tous les modèles de la juridiction (un modèle peut les redéfinir).
[[deviation]]
cle = "motion_procedure"
libelle = "Motion de procédure (rejet préalable, question préalable, renvoi en commission)"
fondement = "Règlement de l'AN, art. 91 ; règlement du Sénat, art. 44"
effet = "rejoint"
si = "adoptée|par l'adoption|renvoyé"
effet_si = "remplace"

[[deviation]]
cle = "retrait"
libelle = "Retrait"
fondement = "Retrait par son auteur ou par le Gouvernement, avant l'adoption définitive"
effet = "termine"
issue = "retire"

[[deviation]]
cle = "retrait_ordre_du_jour"
libelle = "Retiré de l'ordre du jour"
fondement = "Conférence des présidents"
effet = "rejoint"

[[deviation]]
cle = "irrecevabilite"
libelle = "Déclaré irrecevable"
fondement = "Constitution, art. 40 et 41 ; règlements des assemblées"
effet = "termine"
issue = "irrecevable"

[[deviation]]
cle = "caducite"
libelle = "Caducité"
fondement = "Fin de législature ou dissolution (textes en instance à l'AN) ; renouvellement partiel du Sénat (propositions des sénateurs non adoptées, règlement du Sénat) : état publié par DOSLEG"
effet = "termine"
issue = "caduc"

[[deviation]]
cle = "fusion"
libelle = "Fusionné avec un autre dossier"
fondement = "Examen joint (état publié par DOSLEG)"
effet = "termine"
issue = "fusionne"

