# Publication opendata : fichiers statiques lus par les applications (mobile, web), CORS ouvert.
# Seul /srv/publication est servi : /app/data (open data brut, base complète) reste privé.
server {
    listen 80;
    server_name _;
    root /srv/publication;

    # courante.db sert à calculer le prochain correctif : jamais servie.
    location ~ /courante\.db$ {
        return 404;
    }

    # index.json et manifestes annoncent les nouvelles versions : toujours revalidés.
    location ~ \.json$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Bases et correctifs : un fichier par version, jamais modifié.
    location / {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
