<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On verra — votes des députés</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <div class="marque">
      <h1>On verra</h1>
      <p>Qui a voté quoi sur chaque loi à l'Assemblée nationale</p>
    </div>
    <form class="filtres" id="filtres" role="search">
      <label class="champ champ-recherche">
        <span>Rechercher une loi</span>
        <input type="search" name="q" placeholder="narcotrafic, retraites, budget…" autocomplete="off">
      </label>
      <label class="champ">
        <span>Législature</span>
        <select name="legislature">
          <option value="">Toutes</option>
          <option value="17" selected>17e (depuis 2024)</option>
          <option value="16">16e (2022-2024)</option>
          <option value="15">15e (2017-2022)</option>
        </select>
      </label>
      <label class="champ">
        <span>Importance</span>
        <select name="niveau">
          <option value="">Tous niveaux</option>
          <option value="majeure">Majeures</option>
          <option value="standard">Standard</option>
          <option value="technique">Techniques</option>
        </select>
      </label>
      <label class="champ">
        <span>Trier par</span>
        <select name="tri">
          <option value="saillance">Saillance</option>
          <option value="date">Date</option>
          <option value="titre">Titre</option>
        </select>
      </label>
    </form>
  </header>

  <main class="disposition">
    <aside class="colonne-lois" aria-label="Lois">
      <p class="compte" id="compte-lois" aria-live="polite"></p>
      <ol class="liste-lois" id="liste-lois"></ol>
    </aside>

    <section class="detail" id="detail" aria-live="polite">
      <p class="vide">Choisissez une loi dans la liste.</p>
    </section>
  </main>

  <div class="infobulle" id="infobulle" role="tooltip" hidden></div>

  <footer class="pied">
    Données : <a href="https://data.assemblee-nationale.fr">open data de l'Assemblée nationale</a>.
    Plan de l'hémicycle : <a href="https://www.assemblee-nationale.fr/dyn/vos-deputes/hemicycle">Assemblée nationale</a>.
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
