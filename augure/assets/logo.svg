<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Augure, par couches : sièges, barre (cache de la pupille), pupille. Animation prévue :
       la barre descend un peu, la pupille remonte jusqu'à être entièrement ronde. -->
  <defs>
    <mask id="allees" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g stroke="#000" stroke-width="18">
        <line x1="512" y1="640" x2="512" y2="180" transform="rotate(-54 512 640)"/>
        <line x1="512" y1="640" x2="512" y2="180" transform="rotate(-18 512 640)"/>
        <line x1="512" y1="640" x2="512" y2="180" transform="rotate(18 512 640)"/>
        <line x1="512" y1="640" x2="512" y2="180" transform="rotate(54 512 640)"/>
      </g>
    </mask>
    <clipPath id="au-dessus-de-la-barre">
      <rect id="cache" x="0" y="0" width="1024" height="656"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#0b0d0c"/>
  <g transform="translate(0 70)">
  <!-- 1. Sièges -->
  <g id="sieges" fill="none" stroke="#e6ece8" stroke-width="34" mask="url(#allees)">
    <path d="M 122 640 A 390 390 0 0 1 902 640"/>
    <path d="M 202 640 A 310 310 0 0 1 822 640"/>
    <path d="M 282 640 A 230 230 0 0 1 742 640"/>
  </g>
  <!-- 3. Pupille, masquée sous la barre -->
  <g clip-path="url(#au-dessus-de-la-barre)">
    <circle id="pupille" cx="512" cy="656" r="72" fill="#ff3b30"/>
  </g>
  <!-- 2. Barre : bords alignés sur les extrémités des sièges -->
  <rect id="barre" x="105" y="656" width="814" height="12" fill="#5d6a64"/>
  </g>
</svg>

