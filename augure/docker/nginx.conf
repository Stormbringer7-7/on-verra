# App web (export Expo). /api relaie le service « api » : l'app l'appelle sur sa propre
# origine, sans CORS ni adresse à connaître au build.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Les polices .ttf ne sont pas dans mime.types : servies en octet-stream, jamais compressées.
    include mime.types;
    types {
        font/ttf ttf;
    }

    # Niveau 6 au lieu de 1 par défaut : le script de l'app (≈ 1,2 Mo) passe sous les 300 Ko. Les
    # polices web sont en woff2, déjà compressées.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json font/ttf;

    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Fichiers de l'export (scripts, polices, images) : noms à empreinte, gardés en cache.
    location ~ ^/(_expo|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Application monopage : les adresses (/depute/17/PA…, /scrutins) reviennent à index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
