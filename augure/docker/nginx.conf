# App web (export Expo). /donnees relaie le service « publication » d'opendata :
# l'app lit les bases sur sa propre origine, sans CORS ni adresse à connaître au build.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location /donnees/ {
        proxy_pass http://publication/;
    }

    # Fichiers de l'export : noms à empreinte, gardés en cache.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Application monopage : les adresses (/depute/17/PA…, /scrutins) reviennent à index.html.
    # SQLite en WebAssembly (expo-sqlite) : page isolée (COOP/COEP) pour SharedArrayBuffer.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
