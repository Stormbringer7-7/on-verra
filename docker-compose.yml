# Déploiement de big-brother (« Nos politiques ont du talent ») :
#   donnees     : (Python) charge chaque jour la base CivicTrace (base « civictrace ») depuis l'open
#                 data : AN, Sénat, Conseil constitutionnel, HATVP, RNE, INSEE ; projections, contrôles
#   postgres    : la base lue par l'API
#   api         : (Node) exécute les commandes de l'app sur Postgres ; l'app ne contient aucun SQL
#   web         : (nginx) app web ; /api relaie « api »
#   pgadmin     : (profil « admin ») administration de Postgres, http://127.0.0.1:8083
#   caddy       : seule entrée publique, HTTPS automatique — https://$DOMAINE (/ = app, /api = api)
#
#   cp .env.example .env                 # DOMAINE, POSTGRES_PASSWORD
#   docker compose up -d --build         # base vide : premier chargement ≈ 40 min (docs/README.md,
#                                        # « Déployer » : partir d'un dump et du cache brut)
#   docker compose logs -f donnees
#
# Données persistées sur l'hôte : opendata/data (cache des fichiers bruts, rapports de contrôle).
# La base (volume « postgres ») se reconstruit depuis l'open data si elle est perdue.
# web, api et postgres restent joignables depuis la machine seulement (127.0.0.1:8080, :8082 et
# :5433), pour le développement ; depuis l'extérieur, tout passe par Caddy.

name: big-brother

x-postgres-url: &postgres-url postgres://big-brother:${POSTGRES_PASSWORD:-big-brother}@postgres:5432/civictrace

services:
  donnees:
    build:
      context: ./opendata
      dockerfile: Dockerfile
    command: ["canon-en-boucle"]
    environment:
      INTERVALLE_MAJ: "86400"          # secondes entre deux chargements (1 jour)
      AGE_MAX: "20"                    # heures avant de redemander un fichier à la source (304 s'il n'a pas changé)
      DATABASE_URL: *postgres-url
    volumes:
      - ./opendata/data:/app/data      # cache des fichiers bruts (data/brut) et rapports : privé
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    shm_size: 256mb                    # /dev/shm à 64 Mo par défaut : trop peu pour les projections
    environment:
      POSTGRES_USER: big-brother
      POSTGRES_DB: big-brother
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-big-brother}
    ports:
      - "127.0.0.1:5433:5432"          # tests de l'API (api/tests) et consultation depuis la machine
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro   # volume vide seulement : crée la base civictrace
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "big-brother", "-d", "big-brother"]
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: *postgres-url
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Administration de Postgres (pgAdmin), à la demande et depuis la machine seulement :
  #   docker compose --profile admin up -d pgadmin   → http://127.0.0.1:8083
  # Mode bureau (sans compte pgAdmin) : n'est jamais exposé par Caddy. Le serveur « big-brother »
  # est préenregistré ; mot de passe demandé à la première connexion (POSTGRES_PASSWORD).
  pgadmin:
    image: dpage/pgadmin4:9.8
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com   # exigé au démarrage, inutilisé (pgAdmin refuse .local)
      PGADMIN_DEFAULT_PASSWORD: inutilise-en-mode-bureau
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin       # connexions et préférences
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./augure
      args:
        API_URL: /api                  # même origine : Caddy (ou le nginx de l'app) relaie vers « api »
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      DOMAINE: ${DOMAINE:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # certificats : à conserver (limites de Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres:
  caddy_data:
  caddy_config:
  pgadmin:
