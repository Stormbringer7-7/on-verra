# Déploiement de big-brother :
#   extraction  : (Python) télécharge l'open data, compile et publie une base par législature, chaque jour
#   publication : (nginx) sert le volume « publication » aux applications
#   web         : (nginx) app web « Nos administrés ont du talent » ; /donnees relaie « publication »
#   caddy       : seule entrée publique, HTTPS automatique — https://$DOMAINE (/ = app, /donnees = publication)
#
#   cp .env.example .env                 # DOMAINE
#   docker compose up -d --build         # premier import ~5 min
#   docker compose logs -f extraction
#
# web et publication restent joignables depuis la machine seulement (127.0.0.1:8080 et :8081),
# pour le développement ; depuis l'extérieur, tout passe par Caddy.

name: big-brother

services:
  extraction:
    build:
      context: ./opendata
      dockerfile: Dockerfile
    environment:
      INTERVALLE_MAJ: "86400"          # secondes entre deux mises à jour (1 jour)
    volumes:
      - cache:/app/data                # open data AN, base complète, partitions : privé
      - publication:/srv/publication
    healthcheck:
      # Prêt dès que la première publication existe.
      test: ["CMD", "test", "-f", "/srv/publication/index.json"]
      interval: 30s
      start_period: 15m
    restart: unless-stopped

  publication:
    build:
      context: ./opendata
      dockerfile: Dockerfile.nginx
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - publication:/srv/publication:ro
    restart: unless-stopped

  web:
    build:
      context: ./augure
      args:
        PUBLICATION_URL: /donnees      # même origine : Caddy (ou le nginx de l'app) relaie vers « publication »
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - publication
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      DOMAINE: ${DOMAINE:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # certificats : à conserver (limites de Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - web
      - publication
    restart: unless-stopped

volumes:
  cache:
  publication:
  caddy_data:
  caddy_config:
